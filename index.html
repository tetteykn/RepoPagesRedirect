<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zouaouid Tech</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    background: #1e1e2e; color: #e6e6f0;
  }
  .card {
    width: 100%; max-width: 520px;
    background: #2a2a3c; border: 1px solid #3a3a52; border-radius: 14px;
    padding: 32px 36px; box-shadow: 0 20px 50px rgba(0,0,0,0.45);
  }
  .dots { display: flex; gap: 8px; margin-bottom: 22px; }
  .dots span { width: 12px; height: 12px; border-radius: 50%; }
  .dots span:nth-child(1) { background: #ff5f57; }
  .dots span:nth-child(2) { background: #febc2e; }
  .dots span:nth-child(3) { background: #28c840; }
  h1 { margin: 0 0 6px; font-size: 24px; }
  p.tag { margin: 0 0 22px; color: #a7a7bd; font-size: 15px; }
  ul { margin: 0 0 22px; padding-left: 20px; color: #cfcfe0; line-height: 1.7; }
  a { color: #7fb4ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  footer { margin-top: 26px; font-size: 13px; color: #7c7c95; }
</style>
</head>
<body>
  <main class="card">
    <div class="dots"><span></span><span></span><span></span></div>
    <h1>Zouaouid Tech</h1>
    <p class="tag">Windows utilities and productivity apps.</p>
    <ul>
      <li>Lightweight, native desktop tools</li>
      <li>One-time purchase, lifetime license</li>
      <li>Offline activation &mdash; no account needed</li>
    </ul>
    <p>Support &amp; enquiries: <a href="mailto:YOUR_EMAIL@example.com">YOUR_EMAIL@example.com</a></p>
    <footer>&copy; 2026 Zouaouid Tech. All rights reserved.</footer>
  </main>
</body>
</html>
